name: Action self-test

# The composite action had never been executed. Everything about it was
# unverified: whether `npx --yes @santhosraj/cclint@<v>` resolves a SCOPED
# package to a bin with a different name on a clean runner, whether the SARIF
# redirect and the `sarif-file` output work, and whether the exit code actually
# reflects `fail-on`. A green `npm test` says nothing about any of it.
#
# `uses: ./` runs the action.yml in this checkout rather than a published copy,
# so the file under review is the file under test.

on:
  push:
    branches: [action-selftest]
  workflow_dispatch:

jobs:
  clean-project:
    name: Exits 0 on a project with no findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build a fixture with nothing wrong
        run: |
          mkdir -p fixture/.claude
          cat > fixture/.claude/settings.json <<'JSON'
          { "model": "claude-opus-5" }
          JSON
          cat > fixture/CLAUDE.md <<'MD'
          # Fixture

          - Run the test suite before committing.
          MD

      - name: Run the action
        id: lint
        uses: ./
        with:
          working-directory: fixture
          upload-sarif: "false"

      - name: The SARIF output must exist and parse
        run: |
          set -uo pipefail
          file='${{ steps.lint.outputs.sarif-file }}'
          echo "sarif-file output: '${file}'"
          test -n "$file" || { echo "::error::sarif-file output was empty"; exit 1; }
          test -s "$file" || { echo "::error::SARIF file missing or empty: $file"; ls -la "$(dirname "$file")" || true; exit 1; }
          echo "--- first 400 bytes ---"; head -c 400 "$file"; echo
          # JSON.parse, not require(): require() treats an unknown extension as
          # JavaScript, so a .sarif file throws a SyntaxError before any assertion
          # runs. That bug failed this job on the first attempt and said nothing
          # about the action.
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (s.version !== "2.1.0") throw new Error("unexpected SARIF version: " + s.version);
            if (!s.runs?.[0]?.tool?.driver?.name) throw new Error("no tool.driver.name in SARIF");
            console.log("SARIF ok:", s.runs[0].tool.driver.name, s.runs[0].tool.driver.version ?? "");
          ' "$file"

  failing-project:
    name: Exits non-zero when an error-tier finding exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build a fixture with a trailing comma, which Claude Code rejects
        run: |
          mkdir -p fixture/.claude
          # A trailing comma makes Claude Code discard the whole file — an
          # error-tier finding, so `fail-on: error` must fail the job.
          printf '{ "model": "claude-opus-5", }\n' > fixture/.claude/settings.json

      - name: Run the action (expected to fail)
        id: lint
        continue-on-error: true
        uses: ./
        with:
          working-directory: fixture
          upload-sarif: "false"
          fail-on: error
          # Pinned rather than `latest`, to prove the `version` input is honoured.
          version: 0.2.2

      # Deliberately three steps, not one script. Workflow logs need
      # authentication to read, but per-step conclusions are public — so
      # splitting the checks makes the step NAME carry the diagnosis. A single
      # combined script just says "exit 1" and leaves you guessing which of
      # "wrong outcome", "no output", or "wrong contents" it was.
      - name: CHECK A — the action exited non-zero
        run: |
          echo "outcome='${{ steps.lint.outcome }}'"
          test '${{ steps.lint.outcome }}' = 'failure'

      - name: CHECK B — sarif-file output survived the failure
        run: |
          file='${{ steps.lint.outputs.sarif-file }}'
          echo "sarif-file='${file}'"
          # If this is the step that fails, a failing composite action does not
          # export its outputs to the caller — which matters, because findings
          # are exactly when a consumer wants the SARIF path.
          test -n "$file"

      - name: CHECK C — the SARIF names a json/* rule
        run: |
          set -uo pipefail
          file='${{ steps.lint.outputs.sarif-file }}'
          test -s "$file" || { echo "::error::file missing at $file"; ls -la "$(dirname "$file")" || true; exit 1; }
          head -c 400 "$file"; echo
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const ids = (s.runs?.[0]?.results ?? []).map(r => r.ruleId);
            console.log("rules reported:", ids.join(", ") || "(none)");
            if (!ids.some(id => String(id).startsWith("json/"))) {
              throw new Error("expected a json/* finding for the trailing comma");
            }
          ' "$file"

      # Independent of the caller-visible output: does the file the action wrote
      # exist at the conventional path? Distinguishes "output not exported" from
      # "SARIF never written".
      - name: CHECK D — a SARIF exists in RUNNER_TEMP regardless of outputs
        if: always()
        run: |
          ls -la "$RUNNER_TEMP" || true
          test -s "$RUNNER_TEMP/cclint.sarif"

      - name: CHECK D1 — the SARIF file exists at all (even if empty)
        if: always()
        run: test -f "$RUNNER_TEMP/cclint.sarif"

      # D and D1 together say whether the redirect ran but captured nothing. The
      # probes below then reproduce the action's own commands directly, so the
      # cause is attributed rather than inferred: E is npx resolving the pinned
      # scoped package, F is the SARIF run, G is the exit code being 1 (findings)
      # rather than 2 (the tool itself failed). CHECK A only proved "non-zero",
      # which a crash satisfies too.
      - name: CHECK E — npx can resolve the pinned scoped package
        if: always()
        working-directory: fixture
        run: npx --yes "@santhosraj/cclint@0.2.2" --version

      - name: CHECK F — the SARIF run writes non-empty stdout
        if: always()
        working-directory: fixture
        run: |
          set -uo pipefail
          npx --yes "@santhosraj/cclint@0.2.2" --format=sarif --offline > probe.sarif
          echo "exit=$?  bytes=$(wc -c < probe.sarif)"
          test -s probe.sarif

      - name: CHECK G — that run exits 1 (findings), not 2 (tool failure)
        if: always()
        working-directory: fixture
        run: |
          set -uo pipefail
          npx --yes "@santhosraj/cclint@0.2.2" --format=sarif --offline > /dev/null
          code=$?
          echo "exit code was $code"
          test "$code" = "1"
