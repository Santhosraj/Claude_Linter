name: Action self-test

# The composite action had never been executed. Everything about it was
# unverified: whether `npx --yes @santhosraj/cclint@<v>` resolves a SCOPED
# package to a bin with a different name on a clean runner, whether the SARIF
# redirect and the `sarif-file` output work, and whether the exit code actually
# reflects `fail-on`. A green `npm test` says nothing about any of it.
#
# `uses: ./` runs the action.yml in this checkout rather than a published copy,
# so the file under review is the file under test.

# Runs on every PR and every push to main, not just the branch it was developed
# on. A workflow that only fires on a feature branch is dead YAML the moment that
# branch is merged, and the action goes straight back to unverified — which is
# how the argument-validation suite sat skipped in CI for weeks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  clean-project:
    name: Exits 0 on a project with no findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build a fixture with nothing wrong
        run: |
          mkdir -p fixture/.claude
          cat > fixture/.claude/settings.json <<'JSON'
          { "model": "claude-opus-5" }
          JSON
          cat > fixture/CLAUDE.md <<'MD'
          # Fixture

          - Run the test suite before committing.
          MD

      - name: Run the action
        id: lint
        uses: ./
        with:
          working-directory: fixture
          upload-sarif: "false"

      - name: The SARIF output must exist and parse
        run: |
          set -uo pipefail
          file='${{ steps.lint.outputs.sarif-file }}'
          echo "sarif-file output: '${file}'"
          test -n "$file" || { echo "::error::sarif-file output was empty"; exit 1; }
          test -s "$file" || { echo "::error::SARIF file missing or empty: $file"; ls -la "$(dirname "$file")" || true; exit 1; }
          echo "--- first 400 bytes ---"; head -c 400 "$file"; echo
          # JSON.parse, not require(): require() treats an unknown extension as
          # JavaScript, so a .sarif file throws a SyntaxError before any assertion
          # runs. That bug failed this job on the first attempt and said nothing
          # about the action.
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (s.version !== "2.1.0") throw new Error("unexpected SARIF version: " + s.version);
            if (!s.runs?.[0]?.tool?.driver?.name) throw new Error("no tool.driver.name in SARIF");
            console.log("SARIF ok:", s.runs[0].tool.driver.name, s.runs[0].tool.driver.version ?? "");
          ' "$file"

  pinned-version:
    name: The pinned version input resolves from the registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The README tells people to pin BOTH halves — the action tag and the
      # `version` input — and that input had never been exercised. Two things
      # made it awkward, and both are solved here rather than documented away:
      #
      #   1. A pinned spec matching this repo's own package.json resolves to the
      #      local unbuilt package instead of the registry (dist/ is gitignored,
      #      so npx finds no cli.js). Fixed by pinning a PREVIOUSLY published
      #      version: 0.2.3 can never equal the working version again.
      #   2. npx walks up from the cwd to find a project. Fixed by putting the
      #      fixture in RUNNER_TEMP, outside the checkout entirely — which is
      #      also closer to what a consumer's repo looks like.
      - name: Build a clean fixture outside the checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer/.claude"
          echo '{ "model": "claude-opus-5" }' > "$RUNNER_TEMP/consumer/.claude/settings.json"
          printf '# Consumer\n\n- Run the tests before committing.\n' > "$RUNNER_TEMP/consumer/CLAUDE.md"

      - name: Run the action with an explicit version
        id: lint
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/consumer
          upload-sarif: "false"
          version: 0.2.3

      # The assertion that makes this job worth running: the SARIF must report
      # 0.2.3, proving the pin was honoured. Without this the job would pass
      # identically if `version` were ignored and `latest` installed instead.
      - name: CHECK — the SARIF reports the pinned version, not latest
        run: |
          set -uo pipefail
          file="$RUNNER_TEMP/cclint.sarif"
          test -s "$file" || { echo "::error::no SARIF at $file"; exit 1; }
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const v = s.runs?.[0]?.tool?.driver?.version;
            console.log("driver version:", v);
            if (v !== "0.2.3") {
              throw new Error(`version input was not honoured: SARIF says ${v}, expected 0.2.3`);
            }
          ' "$file"

  failing-project:
    name: Exits non-zero when an error-tier finding exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build a fixture with a trailing comma, which Claude Code rejects
        run: |
          mkdir -p fixture/.claude
          # A trailing comma makes Claude Code discard the whole file — an
          # error-tier finding, so `fail-on: error` must fail the job.
          printf '{ "model": "claude-opus-5", }\n' > fixture/.claude/settings.json

      - name: Run the action (expected to fail)
        id: lint
        continue-on-error: true
        uses: ./
        with:
          working-directory: fixture
          upload-sarif: "false"
          fail-on: error
          # NOT pinned, and the reason is worth recording: a pinned spec cannot
          # be self-tested from inside this repo. Proven on the runner —
          # `npx @santhosraj/cclint@0.2.2` FAILS inside the checkout and SUCCEEDS
          # outside it, while `@latest` succeeds in both. This repo's own
          # package.json is named @santhosraj/cclint at that exact version with
          # `bin.cclint -> dist/cli.js`, and dist/ is gitignored, so a matching
          # pinned spec resolves to the local unbuilt package and finds no
          # cli.js. `latest` cannot be satisfied locally, so it goes to the
          # registry.
          #
          # That is an artifact of the package testing itself, not a defect: a
          # consumer's package.json has a different name, so a pinned version
          # fetches from the registry as intended. The `version` input therefore
          # stays untested here by design.

      # Deliberately three steps, not one script. Workflow logs need
      # authentication to read, but per-step conclusions are public — so
      # splitting the checks makes the step NAME carry the diagnosis. A single
      # combined script just says "exit 1" and leaves you guessing which of
      # "wrong outcome", "no output", or "wrong contents" it was.
      - name: CHECK A — the action exited non-zero
        run: |
          echo "outcome='${{ steps.lint.outcome }}'"
          test '${{ steps.lint.outcome }}' = 'failure'

      # The contract the action actually promises for a failing run: the SARIF is
      # at a fixed path, needing no propagation mechanism. Two attempts to make
      # propagation work failed on a runner — outputs are not exported when the
      # action fails, and a $GITHUB_ENV write from inside a composite did not
      # reach the caller either — so the documented path is the guarantee.
      - name: CHECK B — the documented fixed path is readable by the caller
        if: always()
        run: test -s "$RUNNER_TEMP/cclint.sarif"

      # Observational: exactly one of B2a / B2b RUNS and the other is reported
      # skipped, which says whether splitting enforcement into its own step made
      # outputs propagate on the failing path. Neither can fail the job. Workflow
      # logs need authentication to read; step conclusions are public.
      #
      # Two earlier attempts at this probe failed, both instructive:
      #
      #   1. `continue-on-error: true` on a pass/fail pair. That flag reports a
      #      FAILED step as `success`, so both steps showed green and the probe
      #      carried no information at all.
      #   2. Switching to `if:` but writing `steps.lint.outputs.sarif-file`.
      #      That is valid inside `run:` — it is plain string interpolation —
      #      but NOT inside an expression, where `-` is the subtraction
      #      operator. GitHub rejected the whole file: the run existed with zero
      #      jobs and its name showed as the path instead of `Action self-test`,
      #      which is the signature of an unparseable workflow. Index syntax is
      #      required for any output name containing a hyphen.
      - name: CHECK B2a — outputs.sarif-file DID propagate
        if: ${{ always() && steps.lint.outputs['sarif-file'] != '' }}
        # Block scalar, because `echo "propagated: x"` as a plain scalar puts a
        # `: ` inside it and YAML reads that as a nested mapping.
        run: |
          echo "propagated -> '${{ steps.lint.outputs['sarif-file'] }}'"

      - name: CHECK B2b — outputs.sarif-file did NOT propagate
        if: ${{ always() && steps.lint.outputs['sarif-file'] == '' }}
        run: |
          echo 'empty on the failing path; read $RUNNER_TEMP/cclint.sarif instead'

      - name: CHECK C — the SARIF names a json/* rule
        if: always()
        run: |
          set -uo pipefail
          file="$RUNNER_TEMP/cclint.sarif"
          test -s "$file" || { echo "::error::file missing at $file"; ls -la "$(dirname "$file")" || true; exit 1; }
          head -c 400 "$file"; echo
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const ids = (s.runs?.[0]?.results ?? []).map(r => r.ruleId);
            console.log("rules reported:", ids.join(", ") || "(none)");
            if (!ids.some(id => String(id).startsWith("json/"))) {
              throw new Error("expected a json/* finding for the trailing comma");
            }
          ' "$file"

      # Independent of the caller-visible output: does the file the action wrote
      # exist at the conventional path? Distinguishes "output not exported" from
      # "SARIF never written".
      - name: CHECK D — a SARIF exists in RUNNER_TEMP regardless of outputs
        if: always()
        run: |
          ls -la "$RUNNER_TEMP" || true
          test -s "$RUNNER_TEMP/cclint.sarif"

      - name: CHECK D1 — the SARIF file exists at all (even if empty)
        if: always()
        run: test -f "$RUNNER_TEMP/cclint.sarif"
