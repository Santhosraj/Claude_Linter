name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The whole tool is path handling, and it has only ever been developed on
    # Windows. POSIX is where the untested risk lives — `\`-to-`/` normalisation,
    # absolute-path detection, and the home-directory boundary in project-root
    # resolution all behave differently there.
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # MUST come before `npm test`. test/cli-args.test.ts spawns the built CLI
      # and skips itself when dist/cli.js is absent — and dist/ is gitignored, so
      # on a fresh checkout that skip was silent and the run still passed. Eleven
      # tests never executed in CI, including the argument-validation suite that
      # exists because an unquoted path with spaces made the tool lint the wrong
      # project and report it clean.
      - run: npm run build

      # Replays the recorded conformance corpus. Needs neither the Claude Code
      # binary nor network access — re-recording is a separate, manual step.
      - run: npm test

      # The tool must survive being pointed at its own repository.
      - name: Self-lint
        run: node dist/cli.js --offline

      # Catch packaging regressions before they reach npm: a missing `dist` or a
      # broken `bin` only shows up once installed, not from the source tree.
      - name: Verify the published package actually runs
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null
          npm install ./cclint-*.tgz >/dev/null
          # Explicit path, not `npx cclint`: npx prefers an already-installed
          # binary over the one just packed, so a bare call can report success
          # while testing something else entirely.
          ./node_modules/.bin/cclint --version
