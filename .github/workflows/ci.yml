name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # An unparseable workflow file cannot report itself: GitHub produces a run with
  # ZERO jobs, titled with the file path instead of the workflow name, and no step
  # exists to say why. That happened here once — a commit whose entire content
  # went untested behind what looked like an ordinary red X.
  #
  # So the check lives in a DIFFERENT file from the one most likely to break. Its
  # own job, not a matrix step: YAML does not parse differently per OS, and the
  # first attempt put it in the matrix on the wrong assumption that PyYAML ships
  # with every runner's python. It does not — only ubuntu's, which is exactly the
  # runner this job pins.
  yaml:
    name: Workflow and action files parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python3 -c '
          import sys, glob, yaml
          bad = 0
          for f in sorted(glob.glob(".github/workflows/*.yml")) + ["action.yml"]:
              try:
                  yaml.safe_load(open(f, encoding="utf-8"))
                  print("ok  ", f)
              except Exception as e:
                  bad = 1
                  print(f"::error file={f}::{e}")
          sys.exit(bad)
          '

  test:
    # The whole tool is path handling, and it has only ever been developed on
    # Windows. POSIX is where the untested risk lives — `\`-to-`/` normalisation,
    # absolute-path detection, and the home-directory boundary in project-root
    # resolution all behave differently there.
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # MUST come before `npm test`. test/cli-args.test.ts spawns the built CLI
      # and skips itself when dist/cli.js is absent — and dist/ is gitignored, so
      # on a fresh checkout that skip was silent and the run still passed. Eleven
      # tests never executed in CI, including the argument-validation suite that
      # exists because an unquoted path with spaces made the tool lint the wrong
      # project and report it clean.
      - run: npm run build

      # Replays the recorded conformance corpus. Needs neither the Claude Code
      # binary nor network access — re-recording is a separate, manual step.
      - run: npm test

      # The tool must survive being pointed at its own repository.
      - name: Self-lint
        run: node dist/cli.js --offline

      # Catch packaging regressions before they reach npm: a missing `dist` or a
      # broken `bin` only shows up once installed, not from the source tree.
      - name: Verify the published package actually runs
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null
          # Scoped packages pack as `santhosraj-cclint-<version>.tgz`.
          npm install ./santhosraj-cclint-*.tgz >/dev/null
          # Explicit path, not `npx cclint`: npx prefers an already-installed
          # binary over the one just packed, so a bare call can report success
          # while testing something else entirely.
          ./node_modules/.bin/cclint --version
