name: cclint
description: Lint CLAUDE.md, hooks, and MCP config for silent conflicts, dead references, and token bloat.
author: cclint contributors

branding:
  icon: alert-triangle
  color: orange

inputs:
  working-directory:
    description: Directory to lint.
    required: false
    default: "."
  fail-on:
    description: Severity at which to fail the job — `error` or `warning`.
    required: false
    default: error
  strict:
    description: Include heuristic (info-tier) findings.
    required: false
    default: "false"
  semantic:
    description: >
      Adjudicate candidate rule conflicts with a model. Requires anthropic-api-key.
      Off by default — the deterministic checks need no credentials.
    required: false
    default: "false"
  anthropic-api-key:
    description: >
      Optional. Enables exact token counts and, with `semantic: true`, the
      adjudication pass. Without it the action still runs fully; token figures
      are reported as estimates.
    required: false
  upload-sarif:
    description: Upload results to GitHub code scanning.
    required: false
    default: "true"
  version:
    description: npm version spec of @santhosraj/cclint to run.
    required: false
    default: latest

outputs:
  sarif-file:
    description: >
      Path to the generated SARIF file. Treat it as best-effort: outputs are not
      reliably exported when the action fails, and the action fails whenever a
      finding meets `fail-on`. The file is always written to
      $RUNNER_TEMP/cclint.sarif — read that path directly if you need it on a
      failing run.
    value: ${{ steps.run.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Run cclint
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        set -uo pipefail

        args=(--format=sarif)
        [ "${{ inputs.strict }}" = "true" ] && args+=(--strict)
        [ "${{ inputs.semantic }}" = "true" ] && args+=(--semantic)
        # Without a key, skip the network entirely rather than waiting on
        # requests that cannot succeed.
        [ -z "${ANTHROPIC_API_KEY:-}" ] && args+=(--offline)

        sarif="$RUNNER_TEMP/cclint.sarif"
        npx --yes "@santhosraj/cclint@${{ inputs.version }}" "${args[@]}" > "$sarif"
        status=$?

        # The path is ALSO fixed and documented ($RUNNER_TEMP/cclint.sarif),
        # because propagating it out of a composite action proved unreliable and
        # two attempts to fix that failed on a real runner: with findings present
        # the SARIF was written and non-empty while the caller saw neither
        # `outputs.sarif-file` nor a $GITHUB_ENV variable. A consumer that reads
        # the fixed path needs no propagation mechanism at all.
        echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"

        # Re-run for a readable job log. Cheap: token counts are cached from
        # the pass above, and the deterministic checks are pure file I/O.
        text_args=(--fail-on="${{ inputs.fail-on }}")
        [ "${{ inputs.strict }}" = "true" ] && text_args+=(--strict)
        [ -z "${ANTHROPIC_API_KEY:-}" ] && text_args+=(--offline)
        npx --yes "@santhosraj/cclint@${{ inputs.version }}" "${text_args[@]}" || status=$?

        # Deliberately exits 0 even when the lint found something. `fail-on` is
        # enforced by the last step instead, and the reason is mechanical: the
        # runner applies a step's $GITHUB_OUTPUT and $GITHUB_ENV files AFTER the
        # step, and skips both when the step failed. Verified on a runner —
        # exiting non-zero here left the SARIF written and non-empty while the
        # caller saw neither `outputs.sarif-file` nor CCLINT_SARIF_FILE. Writing
        # to both channels was not enough; the step itself has to succeed.
        echo "status=$status" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      # v4, not v3: v3 declares `using: node20`, which GitHub now force-runs on
      # node24 with a deprecation warning. This one is in the consumer's path —
      # every caller who leaves `upload-sarif` at its default runs it — so it
      # matters more than the pins in this repo's own workflows.
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.run.outputs.sarif-file }}
        category: cclint

    # Enforcement lives here so the step above can succeed and publish its
    # output and env files. Fails the action with the linter's own exit code, so
    # `fail-on` behaves exactly as before from the caller's point of view.
    - name: Enforce fail-on
      if: always()
      shell: bash
      run: |
        code='${{ steps.run.outputs.status }}'
        # An empty value means the step above died before recording a status,
        # which is a tool failure rather than a clean pass.
        [ -n "$code" ] || code=1
        echo "cclint exit code: $code"
        exit "$code"
